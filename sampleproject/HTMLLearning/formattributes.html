<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Form Attributes</legend>
        <form>
            FirstName:
            <input type="text" name="firstname" placeholder="Enter FirstName">
            <br><br>
            LastName:
            <input type="text" name="firstname" maxlength="10" autofocus="">
            <br><br>
            Address1:
            <input type="text" name="address1" value="Bangalore" readonly>
            <br><br>
            Address2:
            <input type="text" value="Attiguppe" name="address2" disabled>
            <br><br>
            Age:
            <input type="number" name="age" min="10" max="25">
            <br><br>
            Hobbies:
            <input type="checkbox" name="hohbbies[]" checked>Reading
            <input type="checkbox" name="hohbbies[]">Writing
            <input type="checkbox" name="hohbbies[]">Swimming
            <br><br>
            <input type="submit" name="Save">
            <input type="reset" name="Reset">
        </form>
    </fieldset>
</body>
</html>
