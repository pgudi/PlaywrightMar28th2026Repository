<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function display(){
            document.write("Display Even Numbers:"+"<br/>")
            for(let i=10;i<=40;i++){
                if(i%2==0){
                    document.write("Even Number :"+i+"<br/>")
                }
            }
        }
    </script>
</head>
<body>
    <h3>Execute Result:</h3>
    <button name="execute" onmouseout="display()">Execute</button>
</body>
</html>
